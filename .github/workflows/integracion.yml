name: Integración BIM y costos
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [integration/nexo-ddd]
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nexo-ia/requirements.txt
      - run: python -m pip install -r nexo-ia/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python nexo-ia/pruebas/test_ia.py
      - run: python nexo-ia/pruebas/test_costos.py
      - run: python nexo-ia/pruebas/test_escaneo.py
      - run: python nexo-ia/pruebas/humo_demo.py --rapido
